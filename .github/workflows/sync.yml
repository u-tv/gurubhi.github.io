name: Daily Dailymotion Auto-Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node <<'NODE'
          const fs = require('fs');
          const user = 'dhamtan';
          const url = `https://api.dailymotion.com/user/${user}/videos?fields=id,title,thumbnail_url&limit=100`;
          async function main() {
            let allVideos = [];
            for (let page = 1; page <= 5; page++) {
              const res = await fetch(`${url}&page=${page}`);
              if (!res.ok) throw new Error(`Fetch failed page ${page}: ${res.status}`);
              const data = await res.json();
              if (!data.list || data.list.length === 0) break;
              allVideos = allVideos.concat(data.list);
            }
            fs.mkdirSync('src/data', { recursive: true });
            fs.writeFileSync('src/data/videos.json', JSON.stringify(allVideos, null, 2));
          }
          main().catch(err => { console.error(err); process.exit(1); });
          NODE
      - run: npm run build
      - run: |
          git add src/data/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "Automated Sync: update videos [skip ci]"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - uses: actions/deploy-pages@v4
