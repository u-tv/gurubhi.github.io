name: Daily Dailymotion Auto-Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync Dailymotion Data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const user = 'dhamtan';
          const url = `https://api.dailymotion.com/user/${user}/videos?fields=id,title,thumbnail_url&limit=100`;

          async function main() {
            let allVideos = [];
            for (let page = 1; page <= 5; page++) {
              const res = await fetch(`${url}&page=${page}`);
              if (!res.ok) throw new Error(`Fetch failed page ${page}: ${res.status}`);
              const data = await res.json();
              if (!data.list || data.list.length === 0) break;
              allVideos = allVideos.concat(data.list);
            }
            fs.mkdirSync('src/data', { recursive: true });
            fs.writeFileSync('src/data/videos.json', JSON.stringify(allVideos, null, 2));
            console.log(`Synced ${allVideos.length} videos`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Build Astro Site
        run: npm run build

      - name: Commit Updated Data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add src/data/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "Automated Sync: update videos [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
